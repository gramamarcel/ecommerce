---
# Nexus Repository Manager setup

- name: Run Nexus container
  docker_container:
    name: nexus
    image: sonatype/nexus3
    state: started
    restart_policy: always
    ports:
      - "8081:8081"

- name: Wait for Nexus to start
  uri:
    url: "http://localhost:8081"
    status_code: 200
    retries: 30
    delay: 10
    register: result
    until: result.status == 200
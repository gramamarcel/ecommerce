---
# Main Ansible playbook for full infrastructure setup

- name: Apply base configuration to all servers
  hosts: all
  become: yes
  roles:
    - common

- name: Setup Docker on application servers
  hosts: app
  become: yes
  roles:
    - docker

- name: Setup Redis
  hosts: redis
  become: yes
  roles:
    - redis

- name: Setup Database
  hosts: db
  become: yes
  roles:
    - mysql

- name: Setup Load Balancer
  hosts: lb
  become: yes
  roles:
    - nginx

- name: Setup Jenkins CI Server
  hosts: ci
  become: yes
  roles:
    - jenkins

- name: Setup Nexus Repository
  hosts: nexus
  become: yes
  roles:
    - nexus

- name: Setup SonarQube
  hosts: sonar
  become: yes
  roles:
    - sonar

- name: Setup Monitoring Stack
  hosts: monitoring
  become: yes
  roles:
    - monitoring